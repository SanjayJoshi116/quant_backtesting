name: Daily Screener

on:
  schedule:
    # 9:15 AM IST = 3:45 AM UTC, weekdays only
    - cron: "45 3 * * 1-5"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  screen:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow committing the updated paper-trade ledger back

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore screener data cache
        uses: actions/cache@v4
        with:
          path: data/screener
          key: screener-cache-${{ runner.os }}
          restore-keys: screener-cache-

      - name: Run screener + send email
        run: python bot/main.py
        env:
          GMAIL_SENDER:      ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          ALERT_RECIPIENTS:  ${{ secrets.ALERT_RECIPIENTS }}

      - name: Export public technical snapshot
        # Runs AFTER the screener so data/screener is already warm -- this reuses
        # the cached bars rather than re-downloading 2,258 tickers.
        # Publishes the 200 most liquid names; standard indicator values only,
        # no strategy signals, no entry/SL/TP levels.
        run: python tools/export_snapshot.py --top 200

      - name: Publish snapshot to the public site repo
        # Pushes ONLY the computed snapshot to Tilak004/stock-site, which
        # Cloudflare Pages watches. Strategy code never leaves this repo.
        # SITE_REPO_TOKEN is a fine-grained PAT scoped to stock-site with
        # Contents: read+write, and nothing else.
        env:
          SITE_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "SITE_REPO_TOKEN not set — skipping publish."
            exit 0
          fi
          git clone --depth 1             "https://x-access-token:$SITE_TOKEN@github.com/Tilak004/stock-site.git" site_repo
          mkdir -p site_repo/public/data
          cp public/data/snapshot.json site_repo/public/data/snapshot.json
          cd site_repo
          git config user.name  "snapshot-bot"
          git config user.email "actions@github.com"
          git checkout -B main            # also covers a still-empty repo
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged — nothing to publish."
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push -u origin main
          fi

      - name: Persist paper-trade ledger
        # The screener logs new signals + updates open positions in
        # logs/paper_trades.csv. Commit it back so the ledger survives across
        # cloud runs instead of being discarded when the runner is torn down.
        run: |
          git config user.name  "daily-screener-bot"
          git config user.email "actions@github.com"
          # NOT public/data/snapshot.json: .gitignore has a bare "data/" rule,
          # which matches public/data/ too, so `git add` on it exits 1 and fails
          # this step. The snapshot does not belong in this repo anyway -- the
          # previous step already pushed it to the public site repo.
          git add logs/paper_trades.csv
          if git diff --cached --quiet; then
            echo "No paper-trade changes to commit."
          else
            git commit -m "chore: update paper-trade ledger [skip ci]"
            git pull --rebase --autostash origin master
            git push
          fi
