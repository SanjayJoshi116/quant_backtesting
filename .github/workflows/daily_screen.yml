name: Daily Screener

on:
  schedule:
    # 9:15 AM IST = 3:45 AM UTC, weekdays only
    - cron: "45 3 * * 1-5"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore screener data cache
        uses: actions/cache@v4
        with:
          path: data/screener
          key: screener-cache-${{ runner.os }}
          restore-keys: screener-cache-

      - name: Run screener + send email
        run: python bot/main.py
        env:
          GMAIL_SENDER:      ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          ALERT_RECIPIENTS:  ${{ secrets.ALERT_RECIPIENTS }}
