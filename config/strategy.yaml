# NSE Swing Strategy — Single source of truth for all parameters.
# Both the backtester and the live screener read from this file.
# Bump config_version whenever you change any value so audit logs stay traceable.
#
# Active values = WFO-optimised (walk-forward 2016-2020 IS, 2021-2026 OOS).
# Default/baseline values shown in comments for reference.

config_version: "1.3"

# ── Exit / Risk management ────────────────────────────────────────────────────
exit:
  sl_mult:       1.5     # SL  = entry − ATR × sl_mult        (default 2.0)
  tp_mult_long:  3.5     # TP  = entry + ATR × tp_mult_long   (default 3.0)
  tp_mult_short: 2.25    # TP  = entry − ATR × tp_mult_short  (default 2.25)

# ── Trend filters ─────────────────────────────────────────────────────────────
filters:
  adx_long:     18       # minimum ADX to take a long          (default 15, was 12 in v1.0)
  adx_short:    20       # minimum ADX to take a short         (default 25)
  di_gap_min:   5.0      # DI- must lead DI+ by this many pts (short only)
  min_room_atr: 3.0      # minimum ATR room-to-fall (short only)

# ── Entry conditions ──────────────────────────────────────────────────────────
entry:
  # Pullback to EMA21 (PB-L)
  rsi_pb_lo:    35       # RSI must be above this              (default 38)
  rsi_pb_hi:    58       # RSI must be below this              (default 62)
  pb_tol:       1.008    # low ≤ EMA21 × pb_tol

  # Breakout (BO-L)
  rsi_bo_lo:    48
  rsi_bo_hi:    75

  # Short pullback (PB-S)
  rsi_pbs_lo:   45
  rsi_pbs_hi:   60
  pb_short_tol: 0.997    # high ≥ EMA21 × pb_short_tol

  # Short breakout (BO-S)
  rsi_bos_lo:   30
  rsi_bos_hi:   50

  # Volume confirmation
  vol_mult_long:  1.1    # volume ≥ vol_ma × vol_mult_long     (default 1.05)
  vol_mult_short: 1.3

# ── Market regime filter ──────────────────────────────────────────────────────
# Block new long entries when Nifty50 is below its nifty_ema_period-day EMA.
# Screener flags (but still sends) signals in a bear regime so you decide.
regime:
  regime_enabled:    false  # TESTED: EMA200 regime filter hurt Sharpe (3.47→3.24).
  #                           Individual stock bull_trend already acts as regime filter.
  #                           Kept as infrastructure; screener still shows Nifty regime
  #                           as an informational warning, not a hard block.
  nifty_ema_period:  200

# ── Data / caching ────────────────────────────────────────────────────────────
data:
  period:          "2y"  # yfinance download period (needs ≥ 250 bars for indicators)
  min_bars:        260   # skip ticker if fewer bars available after download
  cache_ttl_hours: 24    # re-fetch if cached CSV is older than this many hours

# ── Position sizing ───────────────────────────────────────────────────────────
# Risk-based: each trade risks exactly risk_per_trade_pct % of current equity.
# Position size = (equity × risk_pct) / (entry − SL), capped at max_position_pct.
sizing:
  starting_capital:   100000  # INR starting equity for backtest equity curve
  risk_per_trade_pct: 1.5     # % of equity risked per trade (was 2.0 in v1.0)
  max_position_pct:   20.0    # hard cap: never deploy more than this % in one trade

# ── Execution costs (informational — used by backtester) ─────────────────────
costs:
  commission_pct: 0.0005   # 0.05% per side
  slippage_pct:   0.0005   # 0.05% per side
